[project]
name = "aether-ai"
version = "2.0.0"
description = "AETHER: GenAI urban air quality assistant for families navigating winter smog"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=aether --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error", "ignore::DeprecationWarning:starlette.*", "ignore:.*httpx2.*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "PT018"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pyright]
venvPath = "."
venv = ".venv"
